name: Test and publish

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm pack --dry-run

  extension:
    name: VSCode extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: jprot-vscode

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish jprot and create-jprot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for this token-based publish workflow." >&2
            echo "Alternatively configure npm Trusted Publishing and remove the token requirement." >&2
            exit 1
          fi
          # setup-node writes the registry, but this explicit setting keeps the
          # workflow non-interactive and compatible with NPM_TOKEN secrets.
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm config set fund false
          npm config set audit false

          # `create-jprot` is the package `npm create jprot` runs, and it writes
          # the jprot range into every new site straight from its own
          # dependencies.jprot (create-jprot/index.js, jprotSpec()). Because a
          # caret range cannot cross a 0.x minor, publishing jprot without
          # create-jprot leaves `npm create jprot` scaffolding and pinning an
          # old release — a new user gets a site with none of the current
          # features and no way to notice. So the two always go out together.
          #
          # "Is this version already on npm?" is the whole gate. The previous
          # `git diff-tree … | grep -qx package.json` guard was dead code:
          # actions/checkout is a depth-1 clone, so HEAD has no parent and
          # diff-tree lists the entire tree, matching package.json on every
          # push. Asking the registry is both correct and self-healing — it
          # also publishes a version that a failed run left behind.
          publish_if_unreleased() {
            dir="$1"
            meta="$(node -p "const p=require('fs').readFileSync('$dir/package.json','utf8');const j=JSON.parse(p);j.name+' '+j.version")"
            name="${meta% *}"
            version="${meta##* }"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "==> $name@$version is already published; skipping."
              return 0
            fi
            echo "==> publishing $name@$version"
            npm publish "$dir" --provenance --access public --ignore-scripts
          }

          publish_if_unreleased .
          publish_if_unreleased create-jprot

  pages:
    name: Deploy documentation to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Export documentation site
        run: node core/cli.js export --out dist --base-path /JPROT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4