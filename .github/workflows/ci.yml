name: Test and publish

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish only a new package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for this token-based publish workflow." >&2
            echo "Alternatively configure npm Trusted Publishing and remove the token requirement." >&2
            exit 1
          fi
          # setup-node writes the registry, but this explicit setting keeps the
          # workflow non-interactive and compatible with NPM_TOKEN secrets.
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm config set fund false
          npm config set audit false
          changed_files="$(git diff-tree --root --no-commit-id --name-only -r HEAD)"
          if ! printf '%s\n' "$changed_files" | grep -qx 'package.json'; then
            echo "package.json did not change; skipping publish."
            exit 0
          fi
          package_version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"
          published_version="$(npm view "$package_name@$package_version" version 2>/dev/null || true)"
          if [ -n "$published_version" ] && [ "$package_version" = "$published_version" ]; then
            echo "Version $package_version is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts

  pages:
    name: Deploy documentation to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Export documentation site
        run: node core/cli.js export --out dist --base-path /JPROT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
